[package]
name = "retium-sdk"
description = "Rust client for the Retium blockchain: addresses, keys, signing, transactions and RPC"
keywords = ["retium", "blockchain", "post-quantum", "ml-dsa", "sdk"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "retium_sdk"
path = "src/lib.rs"

[[bin]]
name = "retium"
path = "src/bin/retium.rs"
required-features = ["cli"]

[features]
default = ["rpc", "cli"]
# HTTP client for talking to a Retium RPC endpoint.
rpc = ["dep:reqwest", "dep:tokio"]
# The `retium` command-line tool.
cli = ["rpc", "dep:clap"]

[dependencies]
ml-dsa = "=0.1.1"
blake3 = "1.8"
hex = "0.4"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
zeroize = "1.8"
thiserror = "2.0"
# The node's own wasm reader, same version, so the weight the SDK computes is
# the weight the chain computes.
wasmparser = "=0.121.2"
reqwest = { version = "0.12", features = ["json"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
clap = { version = "4.5", features = ["derive", "env"], optional = true }

[dev-dependencies]
# The wire-format test builds the signed bytes by hand.
bincode = "1.3"
blake3 = "1.8"
