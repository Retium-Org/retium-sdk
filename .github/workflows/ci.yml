name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: format, lint, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # The toolchain rust-toolchain.toml pins, so CI builds the bytes a
      # contributor builds.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      # The example must always build as a real contract, and stay small.
      - name: Build the example contract
        run: cargo build --release --target wasm32-unknown-unknown -p hello_counter

      - name: Check the contract is deployable
        run: |
          wasm=target/wasm32-unknown-unknown/release/hello_counter.wasm
          size=$(wc -c < "$wasm" | tr -d ' ')
          echo "contract is $size bytes"
          test "$size" -le 1048576

      # Host tests never go through the wasm entry point. This does.
      - name: Run the example the way the runtime does
        run: node examples/run-as-runtime.mjs target/wasm32-unknown-unknown/release/hello_counter.wasm

      # The build docs/06-verifying-code.md documents. Linux and macOS must
      # print the same code hash.
      - name: Reproducible build
        if: runner.os != 'Windows'
        run: |
          RUSTFLAGS="-D warnings --remap-path-prefix=$PWD=/src --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo" \
            cargo build --release --locked --target wasm32-unknown-unknown -p hello_counter
          cargo run -q -p retium-sdk --bin retium -- key new ci.sk > /dev/null
          cargo run -q -p retium-sdk --bin retium -- deploy target/wasm32-unknown-unknown/release/hello_counter.wasm --dry-run --key ci.sk

  other-languages:
    name: contracts in AssemblyScript, C, Zig, Go and WebAssembly text
    runs-on: ubuntu-latest
    env:
      WASMS: >-
        examples/hello_counter_as/build/hello_counter.wasm
        examples/hello_counter_c/counter.wasm
        examples/hello_counter_zig/counter.wasm
        examples/hello_counter_go/counter.wasm
        examples/hello_counter_wat/counter.wasm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: 0.43.0
          binaryen-version: "133"

      - name: Assembler for the WebAssembly text example
        run: cargo install wasm-tools --locked

      - name: Build every example
        run: |
          (cd examples/hello_counter_as && npm ci && npm run build)
          zig cc --target=wasm32-freestanding -Oz -nostdlib -Wl,--no-entry -Wl,--export=on_use \
            -o examples/hello_counter_c/counter.wasm examples/hello_counter_c/counter.c
          zig build-exe examples/hello_counter_zig/counter.zig -target wasm32-freestanding -OReleaseSmall \
            -fno-entry --export=on_use -femit-bin=examples/hello_counter_zig/counter.wasm
          (cd examples/hello_counter_go && tinygo build -o counter.wasm -target=wasm-unknown -opt=z -no-debug -panic=trap . \
            && node add-start.mjs counter.wasm)
          wasm-tools parse examples/hello_counter_wat/counter.wat -o examples/hello_counter_wat/counter.wasm

      - name: Run each the way the runtime does
        run: for w in $WASMS; do node examples/run-as-runtime.mjs "$w"; done

      # Every check the chain makes on a deploy, without a network.
      - name: Dry-run each deploy
        run: |
          cargo build -p retium-sdk --bin retium
          ./target/debug/retium key new ci.sk > /dev/null
          for w in $WASMS; do ./target/debug/retium deploy "$w" --dry-run --key ci.sk; done

  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the docs the way docs.rs does
        run: |
          cargo doc -p retium-sdk --no-deps
          cargo doc -p retium-contract --no-deps --target wasm32-unknown-unknown
