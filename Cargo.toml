[workspace]
resolver = "2"
members = ["crates/retium-sdk", "crates/retium-contract", "examples/hello_counter"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Retium-Org/retium-sdk"
homepage = "https://retium.org"
authors = ["Retium"]

[workspace.dependencies]
retium-contract = { version = "0.1.0", path = "crates/retium-contract" }

# Contracts are hashed as deployed, so builds must be small and deterministic.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
